<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found – the bowl you're looking for isn't here.">
    <meta name="robots" content="noindex">
    <title>Page Not Found | Poke Bowl & Fresh Fusion</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF7B54'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23FF7B54'/%3E%3Cpath d='M7 12h10M12 7v10' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #FFF9F2;
            --bg-secondary: #FFF0E6;
            --card-bg: #FFFFFF;
            --text-main: #3E2C1C;
            --text-heading: #1F1A16;
            --text-dim: #7A6A5C;
            --accent: #FF7B54;
            --accent-light: rgba(255,123,84,0.12);
            --accent-soft: rgba(255,123,84,0.06);
            --accent-dark: #E55A2B;
            --border-dim: rgba(255, 123, 84, 0.2);
            --heading-font: 'Baloo 2', cursive;
            --body-font: 'Inter', sans-serif;
        }

        [data-theme="dark"] {
            --bg-primary: #1A1410;
            --bg-secondary: #241E18;
            --card-bg: #2C241E;
            --text-main: #F0E6DE;
            --text-heading: #FFF9F5;
            --text-dim: #B8A89C;
            --accent: #FF8B66;
            --accent-light: rgba(255,139,102,0.15);
            --accent-soft: rgba(255,139,102,0.08);
            --accent-dark: #E55A2B;
            --border-dim: rgba(255, 139, 102, 0.25);
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            font-family: var(--body-font);
            background-color: var(--bg-primary);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            line-height: 1.7;

            /* CENTERING ENGINE */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh; /* modern dynamic viewport height */
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Ambient background orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 {
            width: 520px; height: 520px;
            background: var(--accent);
            top: -180px; left: -180px;
            opacity: 0.22;
            animation: floatOrb 12s ease-in-out infinite;
        }
        .orb-2 {
            width: 460px; height: 460px;
            background: var(--accent);
            bottom: -160px; right: -160px;
            opacity: 0.18;
            animation: floatOrb 14s ease-in-out infinite reverse;
        }
        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.08); }
        }

        /* Faint dotted grid */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(var(--accent-light) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }

        /* Theme toggle — fixed top-right */
        .theme-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            width: 2.7rem;
            height: 2.7rem;
            background: var(--card-bg);
            border: 1.5px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            cursor: pointer;
            transition: 0.25s;
            z-index: 100;
            box-shadow: 0 8px 22px rgba(0,0,0,0.08);
        }
        [dir="rtl"] .theme-toggle { right: auto; left: 1.5rem; }
        .theme-toggle:hover {
            background: var(--accent);
            color: #FFFFFF;
            transform: scale(1.08) rotate(15deg);
        }

        /* CENTER WRAPPER — this is the true centerpiece */
        .error-wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 720px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Big layered 404 */
        .error-code-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 1rem;
        }
        .error-code-ghost {
            position: absolute;
            top: 8px;
            left: 8px;
            font-family: var(--heading-font);
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 800;
            color: transparent;
            -webkit-text-stroke: 2px var(--accent-light);
            line-height: 1;
            letter-spacing: -0.04em;
            z-index: 1;
            user-select: none;
        }
        .error-code {
            position: relative;
            font-family: var(--heading-font);
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            letter-spacing: -0.04em;
            z-index: 2;
            animation: float404 5s ease-in-out infinite;
            filter: drop-shadow(0 12px 30px rgba(255,123,84,0.35));
        }
        @keyframes float404 {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Badge */
        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1.1rem;
            border-radius: 40px;
            background: var(--card-bg);
            border: 1.5px solid var(--border-dim);
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
        }
        .error-badge i {
            font-size: 0.75rem;
            animation: pulseDot 2s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        /* Headline */
        .error-title {
            font-family: var(--heading-font);
            font-size: clamp(1.7rem, 4vw, 2.5rem);
            font-weight: 800;
            color: var(--text-heading);
            line-height: 1.2;
            margin: 0 0 1rem;
            letter-spacing: -0.01em;
        }
        .error-title span {
            color: var(--accent);
            position: relative;
            display: inline-block;
        }
        .error-title span::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: 0.05em;
            height: 0.18em;
            background: var(--accent-light);
            border-radius: 40px;
            z-index: -1;
        }

        /* Description */
        .error-description {
            font-size: 1.05rem;
            color: var(--text-dim);
            line-height: 1.75;
            max-width: 520px;
            margin: 0 auto 2.5rem;
        }

        /* Actions */
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: var(--accent);
            color: #FFFFFF;
            padding: 0.95rem 2rem;
            border-radius: 9999px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            transition: 0.25s;
            box-shadow: 0 10px 26px rgba(255,123,84,0.35);
            border: 2px solid var(--accent);
            font-size: 1rem;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.7s;
        }
        .btn-primary:hover::before { transform: translateX(100%); }
        .btn-primary:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(255,123,84,0.45);
        }
        .btn-primary i, .btn-primary span { position: relative; z-index: 2; }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border-dim);
            color: var(--text-main);
            padding: 0.95rem 2rem;
            border-radius: 9999px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            transition: 0.25s;
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-3px);
            background: var(--accent-soft);
        }

        /* Floating decorative icons */
        .float-icon {
            position: fixed;
            color: var(--accent);
            opacity: 0.15;
            pointer-events: none;
            z-index: 1;
            animation: floatIcon 8s ease-in-out infinite;
        }
        .fi-1 { top: 18%; left: 8%; font-size: 2.4rem; animation-delay: 0s; }
        .fi-2 { top: 70%; left: 12%; font-size: 1.8rem; animation-delay: 2s; }
        .fi-3 { top: 22%; right: 10%; font-size: 2rem; animation-delay: 1s; }
        .fi-4 { bottom: 18%; right: 14%; font-size: 2.6rem; animation-delay: 3s; }
        .fi-5 { top: 45%; left: 5%; font-size: 1.5rem; animation-delay: 4s; }
        .fi-6 { top: 55%; right: 6%; font-size: 1.7rem; animation-delay: 2.5s; }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.15; }
            50% { transform: translateY(-18px) rotate(8deg); opacity: 0.25; }
        }

        /* Footer brand line */
        .error-footer {
            margin-top: 4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 600;
        }
        .error-footer-logo {
            width: 2rem; height: 2rem;
            background: var(--accent);
            border-radius: 0.6rem;
            display: flex; align-items: center; justify-content: center;
            color: #FFFFFF;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(255,123,84,0.35);
        }
        .error-footer strong {
            color: var(--text-heading);
            font-family: var(--heading-font);
            font-weight: 800;
        }
        .error-footer strong span { color: var(--accent); }

        /* RTL */
        [dir="rtl"] .btn-primary i.fa-arrow-right,
        [dir="rtl"] .btn-outline i.fa-arrow-right { transform: rotate(180deg); }

        /* Small screens */
        @media (max-width: 480px) {
            body { padding: 1.25rem; }
            .error-description { font-size: 0.95rem; margin-bottom: 2rem; }
            .error-actions {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                max-width: 320px;
                margin: 0 auto;
            }
            .error-actions a { justify-content: center; width: 100%; }
            .theme-toggle { top: 1rem; right: 1rem; width: 2.4rem; height: 2.4rem; }
            [dir="rtl"] .theme-toggle { right: auto; left: 1rem; }
            .fi-1, .fi-3, .fi-5 { font-size: 1.5rem; }
            .fi-2, .fi-4, .fi-6 { font-size: 1.2rem; }
            .error-footer { margin-top: 3rem; font-size: 0.75rem; }
        }

        /* Very short viewports (landscape phones) */
        @media (max-height: 640px) {
            .error-code-wrap { margin-bottom: 0.5rem; }
            .error-description { margin-bottom: 1.5rem; }
            .error-footer { margin-top: 2rem; }
        }
    </style>
</head>
<body>

    <!-- Ambient background -->
    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>
    <div class="bg-grid" aria-hidden="true"></div>

    <!-- Floating decorative icons -->
    <i class="fas fa-fish float-icon fi-1" aria-hidden="true"></i>
    <i class="fas fa-bowl-food float-icon fi-2" aria-hidden="true"></i>
    <i class="fas fa-leaf float-icon fi-3" aria-hidden="true"></i>
    <i class="fas fa-seedling float-icon fi-4" aria-hidden="true"></i>
    <i class="fas fa-shrimp float-icon fi-5" aria-hidden="true"></i>
    <i class="fas fa-mortar-pestle float-icon fi-6" aria-hidden="true"></i>

    <!-- Theme toggle -->
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
        <i class="fas fa-sun"></i>
    </button>

    <!-- Main content (perfectly centered) -->
    <main class="error-wrap">

        <div class="error-badge">
            <i class="fas fa-circle"></i> Error 404 · Page Not Found
        </div>

        <div class="error-code-wrap">
            <span class="error-code-ghost" aria-hidden="true">404</span>
            <span class="error-code">404</span>
        </div>

        <h1 class="error-title">This bowl is <span>empty.</span></h1>

        <p class="error-description">
            The page you're looking for doesn't exist, was moved, or never made it to the menu. Let's get you back to something fresh.
        </p>

        <div class="error-actions">
            <a href="index.html" class="btn-primary">
                <i class="fas fa-house"></i>
                <span>Back to Home</span>
            </a>
            <a href="menu.html" class="btn-outline">
                <i class="fas fa-utensils"></i>
                <span>See Our Menu</span>
            </a>
        </div>

        <div class="error-footer">
            <div class="error-footer-logo"><i class="fas fa-fish"></i></div>
            <div><strong>POKE<span> BOWL</span></strong> · fresh • fusion • vibrant</div>
        </div>

    </main>

    <script>
        (function() {
            const html = document.documentElement;
            const toggle = document.getElementById('theme-toggle');
            const icon = toggle.querySelector('i');

            // Apply saved theme on load
            let theme = localStorage.getItem('theme') || 'light';
            html.setAttribute('data-theme', theme);
            icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';

            // Toggle handler
            toggle.addEventListener('click', function() {
                const current = html.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                icon.className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            });

            // Restore saved RTL direction on load
            const savedDir = localStorage.getItem('direction');
            if (savedDir) html.setAttribute('dir', savedDir);
        })();
    </script>

</body>
</html>
